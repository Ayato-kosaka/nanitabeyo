<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="robots" content="noindex,nofollow" />
		<title>Redirecting...</title>
	</head>
	<body>
		<noscript>JavaScript を有効にしてください。</noscript>

		<script>
			/**
			 * 転送を許可するオリジン。**open redirect を防ぐ唯一の砦**なので、
			 * ここへ外部のホストを足さないこと。
			 *
			 * ⚠️ **配列であることに意味がある。** この relay は `oia-relay` サイト 1 つに
			 * デプロイされ、**本番と開発の両方から使われる**。以前は本番オリジンの
			 * 決め打ちだったため、開発環境（nanitabeyo-dev）から踏むと
			 * `target.origin !== ALLOW_ORIGIN` で弾かれ、**黙って本番のトップへ**
			 * 飛んでいた（実機で「アプリで開く」を押しても目的の画面に着かない、
			 * という形で表面化した）。
			 *
			 * 先頭が既定のフォールバック先。
			 */
			const ALLOW_ORIGINS = ["https://app.nanitabeyo.net", "https://nanitabeyo-dev.web.app"];
			const DEFAULT_ORIGIN = ALLOW_ORIGINS[0];

			const url = new URL(location.href);
			const u = url.searchParams.get("u");

			function safeTarget(raw) {
				if (!raw) return null;

				let decoded;
				try {
					decoded = decodeURIComponent(raw);
				} catch {
					return null;
				}

				let target;
				try {
					target = new URL(decoded);
				} catch {
					return null;
				}

				if (!ALLOW_ORIGINS.includes(target.origin)) return null;
				return target.toString();
			}

			// 弾かれた場合は既定オリジンのトップへ。開発環境から踏んだリンクが
			// ここへ落ちると «本番へ飛ばされた» ように見えるので、上の allowlist を絞りすぎないこと
			const target = safeTarget(u) || DEFAULT_ORIGIN + "/";

			// ✅ 履歴に Relay を残しにくくする
			window.location.replace(target);
		</script>
	</body>
</html>
