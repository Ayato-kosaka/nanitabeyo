name: DB Migrate

# ==============================================================================
# dev / public スキーマへの migration 適用。dev 適用時のみ schema.prisma / Prisma Client を再生成。
#
# ## ⚠️ public への適用は本番 DB の変更です
#
# このリポジトリの本番と開発は「別 DB」ではなく **同じ DB の別スキーマ**
# （本番 = public / 開発 = dev / test）です。適用先を choice で選び、対象外の
# アプリケーションスキーマへ migration が漏れていないことを事後に検算します。
#
# 三重にしてあります。**どれも外さないこと。**
#
# 1. `DB_SCHEMA` は `dev` / `public` の choice のみ許可します。
#    `scripts/apply-migration.sh` は `SET search_path TO $DB_SCHEMA, extensions` を
#    流してから各ファイルを実行するので、スキーマ修飾のない DDL は選択先に落ちます。
#
# 2. 適用前に、対象ファイルが **スキーマ固定を自力で外していないか**を静的に検査します。
#    対象外スキーマの明示修飾や `SET search_path` の再設定を含むファイルがあれば止めます。
#
# 3. 適用の前後で **対象外スキーマのオブジェクト一覧のハッシュ**を取り、
#    差分があれば失敗させます（dev 適用時は public、public 適用時は dev を検算）。
#
# なお migration はテーブルを作るので、資格情報には選択先スキーマへ CREATE できる権限が
# 要ります。`secrets.POSTGRES_DATABASE_URL` には migration 用の接続文字列を登録してください。
#
# ## なぜ Actions でやるのか
# migration は「誰かのローカルから流す」と、いつ・どのファイルまで当たったのかが
# 記録に残りません。dispatch のログが残る形にしておくと、後から追えます。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      target_schema:
        description: "migration の適用先スキーマ（public は本番）"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - public
      from_file:
        description: "適用を開始する migration ファイル名（例: 20260807T0000_create_share_links.sql）。このファイル以降が順に適用されます"
        required: true
        type: string
      dry_run:
        description: "true なら適用せず、対象ファイルと接続先の確認だけ行う"
        required: false
        default: true
        type: boolean
      regenerate_prisma:
        description: "dev 適用後に prisma db pull / generate を実行し、差分をこのブランチへ commit する"
        required: false
        default: true
        type: boolean
      confirm_public:
        description: "public へ実適用する場合のみ true にする（dry run では不要）"
        required: false
        default: false
        type: boolean

# dev / public は同じ DB なので、同時に 2 本流れないよう直列化する
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.target_schema }} スキーマへ migration を適用
    runs-on: ubuntu-latest
    # production Environment に承認ルールがあれば public 適用時に強制される
    environment: ${{ inputs.target_schema == 'public' && 'production' || 'development' }}
    permissions:
      contents: write
    env:
      DB_SCHEMA: ${{ inputs.target_schema }}
      PROTECTED_SCHEMA: ${{ inputs.target_schema == 'public' && 'dev' || 'public' }}
      DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
      MIGRATION_DIR: infra/supabase/migrations

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: secret の有無を確認
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::secrets.POSTGRES_DATABASE_URL が未設定です。migration 対象 DB の接続文字列を登録してください。"
            exit 1
          fi

      - name: public 実適用の確認
        if: ${{ inputs.target_schema == 'public' && !inputs.dry_run }}
        shell: bash
        run: |
          if [ "${{ inputs.confirm_public }}" != "true" ]; then
            echo "::error::public への実適用には confirm_public=true が必要です。"
            exit 1
          fi

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4

      - name: Node をセットアップ
        # スキーマ検査スクリプト（node）を後段で使うため、条件付きにせず常に入れる
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: psql をインストール
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: 適用対象を決める
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ inputs.from_file }}"
          if [ ! -f "${MIGRATION_DIR}/${TARGET}" ]; then
            echo "::error::${MIGRATION_DIR}/${TARGET} が見つかりません。"
            exit 1
          fi
          ls "${MIGRATION_DIR}"/*.sql | sort | awk -v t="${MIGRATION_DIR}/${TARGET}" '$0 >= t' > /tmp/targets.txt
          echo "── ${TARGET} 以降に適用されるファイル ──"
          cat /tmp/targets.txt
          echo "適用先スキーマ: ${DB_SCHEMA}"

      # ── 安全ゲート 2: スキーマ固定を自力で外していないか ──────────────────
      # apply-migration.sh は `SET search_path TO $DB_SCHEMA, extensions` を流してから
      # 各ファイルを実行する。対象外スキーマの明示修飾と search_path の上書きを検査する。
      - name: 対象ファイルが選択スキーマから出ようとしていないか検査
        shell: bash
        # 素朴な grep にしないこと。`-- 匿名ユーザーもあり public.users FK は張らない` のような
        # 日本語コメントに引っかかり、正しい migration が流せなくなる
        # （実際 20260623T0000_create_dish_category_group_votes.sql が該当する）。
        # コメントと文字列リテラルを落としてから見るために専用スクリプトへ切り出してある
        run: xargs -a /tmp/targets.txt node scripts/assert-migration-schema-scoped.mjs --target-schema "${DB_SCHEMA}"

      # ── 安全ゲート 3: 事後の検算に使う対象外スキーマのスナップショット ──────
      - name: 接続先と対象外スキーマのスナップショットを取る
        shell: bash
        run: |
          set -euo pipefail
          psql "${DATABASE_URL}" -tAc "select 'user=' || current_user || ' db=' || current_database()"
          psql "${DATABASE_URL}" -tAc "
            select md5(string_agg(sig, '|' order by sig)) from (
              select c.relkind || ':' || c.relname || ':' || coalesce(count(a.attname)::text,'0') as sig
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              left join pg_attribute a on a.attrelid = c.oid and a.attnum > 0
              where n.nspname = '${PROTECTED_SCHEMA}'
              group by c.relkind, c.relname
            ) t" > /tmp/protected_before.txt
          echo "${PROTECTED_SCHEMA} スキーマのハッシュ(before): $(cat /tmp/protected_before.txt)"

      - name: dry run（適用しない）
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "dry_run=true のため適用しませんでした。"
          echo "適用するには dry_run を false にして再実行してください。"

      - name: migration を適用
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # 既存の scripts/apply-migration.sh をそのまま使う（適用ロジックを二重に持たない）。
          # あのスクリプトは scripts/.env を source するので、ここで生成する。
          # DB_SCHEMA は choice で検証済みの値だけを書き出す
          printf 'DATABASE_URL=%s\nDB_SCHEMA=%s\n' "${DATABASE_URL}" "${DB_SCHEMA}" > scripts/.env
          trap 'rm -f scripts/.env' EXIT
          bash scripts/apply-migration.sh "${{ inputs.from_file }}"

      - name: 対象外スキーマが変わっていないことを検算
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${DATABASE_URL}" -tAc "
            select md5(string_agg(sig, '|' order by sig)) from (
              select c.relkind || ':' || c.relname || ':' || coalesce(count(a.attname)::text,'0') as sig
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              left join pg_attribute a on a.attrelid = c.oid and a.attnum > 0
              where n.nspname = '${PROTECTED_SCHEMA}'
              group by c.relkind, c.relname
            ) t" > /tmp/protected_after.txt
          echo "${PROTECTED_SCHEMA} スキーマのハッシュ(after) : $(cat /tmp/protected_after.txt)"
          if ! diff -q /tmp/protected_before.txt /tmp/protected_after.txt >/dev/null; then
            echo "::error::対象外スキーマ(${PROTECTED_SCHEMA})が変化しました。適用した SQL を確認し、必要なら手で戻してください。"
            exit 1
          fi
          echo "✅ ${PROTECTED_SCHEMA} は不変"

      # ── dev 適用後のみ schema.prisma / Prisma Client を再生成 ──────────────
      - name: 依存関係をインストール
        if: ${{ inputs.target_schema == 'dev' && !inputs.dry_run && inputs.regenerate_prisma }}
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: schema.prisma と Prisma Client を再生成
        if: ${{ inputs.target_schema == 'dev' && !inputs.dry_run && inputs.regenerate_prisma }}
        shell: bash
        # scripts/db-pull.sh を呼ばないのは、あれが api/.env の存在と Supabase CLI の
        # ログインを前提にしており（supabase gen types / converters 生成）、
        # CI では途中で必ず落ちるため。ここでは DATABASE_URL だけで完結する
        # 「introspect → generate」に絞る。Supabase 型と converters の再生成が要る
        # 変更のときは、ローカルで `pnpm db:pull` を実行すること
        run: |
          set -euo pipefail
          sed "s/__SCHEMA__/${DB_SCHEMA}/g" api/prisma/schema.template.prisma > api/prisma/schema.prisma
          pnpm -C api exec prisma db pull --schema prisma/schema.prisma --config ../prisma.config.ts
          pnpm -C api exec prisma generate --schema prisma/schema.prisma --config ../prisma.config.ts

      - name: 差分があればこのブランチへ commit する（dev のみ）
        if: ${{ inputs.target_schema == 'dev' && !inputs.dry_run && inputs.regenerate_prisma }}
        shell: bash
        run: |
          set -euo pipefail
          # scripts/.env が残っていたら絶対に commit しない（接続文字列が入っている）
          rm -f scripts/.env api/.env
          if git diff --quiet -- api/prisma/schema.prisma shared/prisma; then
            echo "schema.prisma / Prisma Client に差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/prisma/schema.prisma shared/prisma
          git commit -m "chore(db): ${DB_SCHEMA} スキーマの introspect 結果を反映する (${{ inputs.from_file }})"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: 適用後のテーブル一覧（先頭 40 件）
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          psql "${DATABASE_URL}" -c \
            "select table_name from information_schema.tables where table_schema='${DB_SCHEMA}' order by 1 limit 40"
