name: Evidence Collect

# 📸 テストエビデンス公開ワークフロー
# - 指定した Claude Worker run の Artifact をダウンロードする
# - オーケストレーターが照合した対象commit SHAとrun結果を記録する
# - 画像・動画を nanitabeyo-public へ公開する
# - オーケストレーターがIssue/PRコメントを作れるようmanifestを生成する
#
# このWorkflow自身はIssue/PRへコメントしない。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Artifactを持つClaude Worker workflow run ID"
        required: true
        type: string
      artifact_name:
        description: "ダウンロードするArtifact名（例: claude-issue-123-review-123456789-1）"
        required: true
        type: string
      source_sha:
        description: "オーケストレーターが照合済みのテスト対象commit SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Publish ${{ inputs.artifact_name }} from run ${{ inputs.run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCS_BUCKET: nanitabeyo-public
      GCP_KEY: ${{ secrets.GCP_SA_KEY }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      # 元runが信頼できるWorkflowであることを .path で判定する（.name は run-name のため使えない）
      # - claude-worker.yml: テストエビデンス収集の本来の入力
      # - e2e-web-test.yml : 手動実行で収集したUIカタログのスクリーンショット
      EXPECTED_WORKFLOW_PATHS: |
        .github/workflows/claude-worker.yml
        .github/workflows/e2e-web-test.yml

    steps:
      - name: 入力値を検証
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_idは数字のみで指定してください。"
            exit 1
          fi

          if [[ ! "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::artifact_nameは英数字・._-のみで指定してください。"
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "::error::source_shaは40〜64桁の16進commit SHAで指定してください。"
            exit 1
          fi

      - name: 元runを検証
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          # 【バグ】run オブジェクトの .name は workflow 名ではなく run-name を返す。
          # claude-worker.yml は run-name を定義しているため .name は
          # "Claude Worker / <task_key> / <model> / <access>" になり、
          # "Claude Worker" と完全一致することは無い（＝この検証は必ず落ちていた）。
          # workflow ファイルを一意に指す .path で判定する。
          WORKFLOW_PATH="$(jq -r '.path' <<<"$RUN_JSON")"
          RUN_NAME="$(jq -r '.name' <<<"$RUN_JSON")"
          EVENT="$(jq -r '.event' <<<"$RUN_JSON")"
          STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion' <<<"$RUN_JSON")"
          SOURCE_URL="$(jq -r '.html_url' <<<"$RUN_JSON")"

          # 許可Workflowの完全一致判定（部分一致で別Workflowを通さないよう1行ずつ比較する）
          IS_ALLOWED_WORKFLOW=false
          while IFS= read -r allowed_path; do
            [[ -z "$allowed_path" ]] && continue
            if [[ "$WORKFLOW_PATH" == "$allowed_path" ]]; then
              IS_ALLOWED_WORKFLOW=true
              break
            fi
          done <<<"$EXPECTED_WORKFLOW_PATHS"

          if [[ "$IS_ALLOWED_WORKFLOW" != "true" || "$EVENT" != "workflow_dispatch" ]]; then
            echo "::error::元runは許可されたWorkflowのworkflow_dispatchではありません（path=$WORKFLOW_PATH, event=$EVENT, run-name=$RUN_NAME）。"
            exit 1
          fi

          if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
            echo "::error::元runが成功完了していません（status=$STATUS, conclusion=$CONCLUSION）。"
            exit 1
          fi

          echo "sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "url=$SOURCE_URL" >> "$GITHUB_OUTPUT"

      - name: Artifactをダウンロード
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: /tmp/evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 画像・動画とmanifestを準備
        id: prepare
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_URL: ${{ steps.source.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import mimetypes
          import os
          import re
          import shutil
          import urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("/tmp/evidence")
          publish = Path("/tmp/public-evidence")
          manifest_dir = Path("/tmp/evidence-manifest")
          publish.mkdir(parents=True, exist_ok=True)
          manifest_dir.mkdir(parents=True, exist_ok=True)

          image_extensions = {".png", ".jpg", ".jpeg", ".webp", ".gif"}
          video_extensions = {".mp4", ".webm", ".mov", ".m4v"}
          allowed_extensions = image_extensions | video_extensions

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          artifact_name = os.environ["ARTIFACT_NAME"]
          bucket = os.environ["GCS_BUCKET"]
          prefix = f"e2e-evidence/{repository}/runs/{run_id}/{artifact_name}"

          used_object_paths = set()

          def safe_object_path(relative, used):
              """GCS オブジェクト名として安全な相対パスを返す。

              gsutil の glob 解釈と URL エンコード肥大を避けるため、
              各セグメントを [A-Za-z0-9._-] だけに落とす。
              衝突したら連番を付ける。
              """
              segments = []
              for segment in relative.parts[:-1]:
                  segments.append(re.sub(r"[^A-Za-z0-9._-]+", "_", segment) or "_")

              stem = relative.stem
              suffix = relative.suffix.lower()
              safe_stem = re.sub(r"[^A-Za-z0-9._-]+", "_", stem).strip("_") or "file"
              safe_suffix = re.sub(r"[^A-Za-z0-9.]+", "", suffix) or ".bin"

              candidate = "/".join(segments + [f"{safe_stem}{safe_suffix}"])
              if candidate not in used:
                  used.add(candidate)
                  return candidate

              counter = 2
              while True:
                  candidate = "/".join(segments + [f"{safe_stem}-{counter}{safe_suffix}"])
                  if candidate not in used:
                      used.add(candidate)
                      return candidate
                  counter += 1

          images = []
          videos = []

          for path in sorted(source.rglob("*")):
              if not path.is_file() or path.is_symlink():
                  continue

              extension = path.suffix.lower()
              if extension not in allowed_extensions:
                  continue

              relative = path.relative_to(source)
              # 【バグ】gsutil は `[` `]` `*` `?` を glob として解釈するため、
              # これらを含むファイル名は「該当なし」となり転送に失敗する。
              # 日本語ファイル名も URL が %エンコードで肥大する。
              # 公開名は安全な文字だけへ正規化し、元の名前は manifest に残す。
              safe_relative = safe_object_path(relative, used_object_paths)
              destination = publish / safe_relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, destination)

              object_name = f"{prefix}/{safe_relative}"
              encoded_object = urllib.parse.quote(object_name, safe="/")
              entry = {
                  "path": relative.as_posix(),
                  "publishedPath": safe_relative,
                  "url": f"https://storage.googleapis.com/{bucket}/{encoded_object}",
                  "contentType": mimetypes.guess_type(path.name)[0] or "application/octet-stream",
              }

              if extension in image_extensions:
                  images.append(entry)
              else:
                  videos.append(entry)

          if not images and not videos:
              raise SystemExit("公開対象の画像・動画がArtifact内にありません。")

          manifest = {
              "schemaVersion": 1,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "repository": repository,
              "sourceRunId": int(run_id),
              "sourceRunUrl": os.environ["SOURCE_URL"],
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "artifactName": artifact_name,
              "bucket": bucket,
              "gcsPrefix": f"gs://{bucket}/{prefix}",
              "publicManifestUrl": (
                  f"https://storage.googleapis.com/{bucket}/"
                  f"{urllib.parse.quote(prefix, safe='/')}/manifest.json"
              ),
              "images": images,
              "videos": videos,
          }

          manifest_path = manifest_dir / "manifest.json"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prefix={prefix}\n")
              output.write(f"image_count={len(images)}\n")
              output.write(f"video_count={len(videos)}\n")
              output.write(f"manifest_url={manifest['publicManifestUrl']}\n")
          PY

      # ubuntu-24.04 ランナーへの gcloud 同梱は保証されていないため、
      # api-deploy.yml と同様に SDK のセットアップを明示する。
      # 既に入っていても害はない。
      - name: Google Cloud SDKをセットアップ
        uses: google-github-actions/setup-gcloud@v2

      - name: Google Cloudへ認証
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GCP_KEY" ]]; then
            echo "::error::Repository Secret GCP_SA_KEYが設定されていません。"
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/gcp-key.json"
          printf '%s' "$GCP_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          gcloud auth activate-service-account --key-file="$KEY_FILE"
          gcloud config set project "$(jq -r '.project_id' "$KEY_FILE")"

      - name: 画像・動画とmanifestをGCSへ公開
        env:
          GCS_PREFIX: ${{ steps.prepare.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob

          media=(/tmp/public-evidence/*)
          gsutil -m \
            -h "Cache-Control:public,max-age=31536000,immutable" \
            cp -r "${media[@]}" "gs://${GCS_BUCKET}/${GCS_PREFIX}/"

          gsutil \
            -h "Cache-Control:public,max-age=300" \
            -h "Content-Type:application/json; charset=utf-8" \
            cp /tmp/evidence-manifest/manifest.json \
            "gs://${GCS_BUCKET}/${GCS_PREFIX}/manifest.json"

      - name: manifestをArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: evidence-manifest-${{ inputs.run_id }}
          path: /tmp/evidence-manifest/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: 結果をJob summaryへ出力
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_COUNT: ${{ steps.prepare.outputs.image_count }}
          VIDEO_COUNT: ${{ steps.prepare.outputs.video_count }}
          MANIFEST_URL: ${{ steps.prepare.outputs.manifest_url }}
        shell: bash
        run: |
          {
            echo "## Evidence published"
            echo
            echo "- Source run: $SOURCE_URL"
            echo "- Commit: \`$SOURCE_SHA\`"
            echo "- Images: $IMAGE_COUNT"
            echo "- Videos: $VIDEO_COUNT"
            echo "- Manifest: $MANIFEST_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 一時的な認証ファイルを削除
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
