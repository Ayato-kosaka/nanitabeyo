name: Firebase Hosting Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Choose your deployment environment.
        options:
          - production
          - preview
          - development
        required: true

jobs:
  firebase-hosting:
    name: Firebase Hosting Deploy (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4

      - name: 🟣 Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.8.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # 🗺️ sitemap.xml は app-expo の build:web が生成する
      #    （app-expo/scripts/generate-sitemap.mjs）。
      #    かつてここで scripts/gen-sitemap.mjs を呼んでいたが、#281 で生成器が
      #    2 本になり、後から走る build:web が旧出力を上書きする状態になっていた。
      #    生成器は 1 本に統一したので、ここでの明示実行は不要。

      # Build our shared library so it emits .d.ts / .js into shared/dist
      - name: 📚 Build shared package
        run: pnpm -F shared run build

      - name: 🏗 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ✨ Update environment variable
        working-directory: app-expo
        run: pnpx eas-cli env:update --variable-name EXPO_PUBLIC_COMMIT_ID --value ${{ github.sha }}  --non-interactive

      - name: 🛠️ Sync environment variables from EAS CLI
        working-directory: app-expo
        run: pnpx eas-cli env:pull ${{ github.event.inputs.target }} --non-interactive

      - name: 🏗️ Build Web App
        run: pnpm --filter app-expo build:web

      # 【デプロイ前ゲート】firebase.json の rewrite 先が dist に実在するかを静的に検証する。
      # 過去に「expo export の出力形式変更(X.html → X/index.html)に rewrite が追従せず、
      # 本番の主要 4 タブへの直リンクが 404 になる」事故が起きたための再発防止。
      # ブラウザ不要・数秒で完了する(e2e-web/tests/config/firebase-rewrites.spec.ts)
      - name: 🔍 Verify firebase.json rewrites match dist
        run: pnpm --filter e2e-web exec playwright test --project=config

      - name: 📄 Generate app-ads.txt from secret
        working-directory: app-expo
        run: echo "${{ secrets.ADMOB_APP_ADS_TXT }}" > dist/app-ads.txt

      - name: 🚀 Deploy to Firebase Hosting
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
          channelId: ${{ github.event.inputs.target == 'production' && 'live' || github.event.inputs.target }}

      # 【デプロイ後検証】デプロイされたばかりの URL に対して @smoke(起動・直リンク)を実行する。
      # production は本番ドメイン、preview/development はプレビューチャンネル URL を対象にする。
      # スモークは NestJS API を呼ばないため、プレビュー URL が API の CORS_ORIGIN に
      # 含まれていなくても成立する
      #
      # 注意: このワークフローは target 未指定で firebase.json の全 Hosting サイト
      # (food-scroll と app-nanitabeyo-net の 2 つ)をデプロイするため、アクションの
      # details_url(= urls[0])は並び順先頭の food-scroll(本番へ 301 リダイレクトするだけの
      # サイト)のプレビュー URL になってしまう。それを対象にするとリダイレクト先の本番を
      # テストして green になり「デプロイしたばかりのアプリを検証していない」ことになるため、
      # urls 配列から app-nanitabeyo-net の URL を明示的に選択する(見つからなければ fail)
      - name: 🔎 Resolve smoke test URL
        id: smoke_url
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.target }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          DEPLOY_URLS: ${{ steps.firebase_deploy.outputs.urls }}
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            url="$WEB_BASE_URL"
          else
            url=$(echo "$DEPLOY_URLS" | jq -r '.[] | select(contains("app-nanitabeyo-net"))' | head -n 1)
          fi
          if [ -z "$url" ]; then
            echo "::error::スモーク対象 URL を解決できませんでした(urls: $DEPLOY_URLS)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "スモーク対象: $url"

      - name: 🎭 Install Playwright browsers
        run: pnpm --filter e2e-web exec playwright install --with-deps chromium

      - name: 🧪 Post-deploy smoke test
        run: pnpm --filter e2e-web exec playwright test --grep "@smoke" --project=desktop-chrome
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.smoke_url.outputs.url }}

      - name: 📊 Upload post-deploy smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-smoke-report
          path: e2e-web/playwright-report/
          retention-days: 14
