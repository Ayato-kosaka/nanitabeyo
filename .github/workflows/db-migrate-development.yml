name: DB Migrate (development only)

# ==============================================================================
# 開発環境スキーマ（dev）への migration 適用と、schema.prisma / Prisma Client の再生成。
#
# ## ⚠️ このワークフローは本番（public スキーマ）を絶対に変更しません
#
# このリポジトリの本番と開発は「別 DB」ではなく **同じ DB の別スキーマ**
# （本番 = public / 開発 = dev / test）です。したがって「別の接続文字列を使う」だけでは
# 守れません。**スキーマの向き先そのものを固定し、事後に検算する**方式にしています。
#
# 三重にしてあります。**どれも外さないこと。**
#
# 1. `DB_SCHEMA` は `dev` のハードコード。**入力にしていません。**
#    `scripts/apply-migration.sh` は `SET search_path TO $DB_SCHEMA, extensions` を
#    流してから各ファイルを実行するので、スキーマ修飾のない DDL は必ず dev に落ちます。
#    選べないことが最大の防御です。
#
# 2. 適用前に、対象ファイルが **スキーマ固定を自力で外していないか**を静的に検査します。
#    `public.` 修飾や `SET search_path` の再設定を含むファイルがあれば止めます。
#    1 の前提（search_path で dev に閉じる）が崩れるのは、この 2 パターンだけです。
#
# 3. 適用の前後で **public スキーマのオブジェクト一覧のハッシュ**を取り、
#    1 ビットでも変わっていたら失敗させます。1・2 をすり抜けても事後に必ず露見します。
#
# なお migration はテーブルを作るので、資格情報には dev スキーマへ CREATE できる権限が
# 要ります（`prisma_dev` は DML だけなので不足します。普段ローカルの
# `scripts/.env` に入れているものと同じ接続文字列を secret へ入れてください）。
#
# ## なぜ Actions でやるのか
# migration は「誰かのローカルから流す」と、いつ・どのファイルまで当たったのかが
# 記録に残りません。dispatch のログが残る形にしておくと、後から追えます。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      from_file:
        description: "適用を開始する migration ファイル名（例: 20260807T0000_create_share_links.sql）。このファイル以降が順に適用されます"
        required: true
        type: string
      dry_run:
        description: "true なら適用せず、対象ファイルと接続先の確認だけ行う"
        required: false
        default: true
        type: boolean
      regenerate_prisma:
        description: "適用後に prisma db pull / generate を実行し、差分をこのブランチへ commit する"
        required: false
        default: true
        type: boolean

# 同時に 2 本流れると適用順が壊れるため直列化する
concurrency:
  group: db-migrate-development
  cancel-in-progress: false

jobs:
  migrate:
    name: dev スキーマへ migration を適用
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # ⚠️ ここを input にしないこと（冒頭の理由）
      DB_SCHEMA: dev
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      MIGRATION_DIR: infra/supabase/migrations

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: secret の有無を確認
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::secrets.DEV_DATABASE_URL が未設定です。ローカルの scripts/.env に入れているものと同じ接続文字列を登録してください。"
            exit 1
          fi

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4

      - name: Node をセットアップ
        # スキーマ検査スクリプト（node）を後段で使うため、条件付きにせず常に入れる
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: psql をインストール
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: 適用対象を決める
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ inputs.from_file }}"
          if [ ! -f "${MIGRATION_DIR}/${TARGET}" ]; then
            echo "::error::${MIGRATION_DIR}/${TARGET} が見つかりません。"
            exit 1
          fi
          ls "${MIGRATION_DIR}"/*.sql | sort | awk -v t="${MIGRATION_DIR}/${TARGET}" '$0 >= t' > /tmp/targets.txt
          echo "── ${TARGET} 以降に適用されるファイル ──"
          cat /tmp/targets.txt

      # ── 安全ゲート 2: スキーマ固定を自力で外していないか ──────────────────
      # apply-migration.sh は `SET search_path TO dev, extensions` を流してから
      # 各ファイルを実行する。したがって dev から出られるのは、ファイル自身が
      # `public.` で修飾するか、search_path を上書きした場合だけ。そこだけ見る。
      - name: 対象ファイルが dev から出ようとしていないか検査
        shell: bash
        # 素朴な grep にしないこと。`-- 匿名ユーザーもあり public.users FK は張らない` のような
        # 日本語コメントに引っかかり、正しい migration が流せなくなる
        # （実際 20260623T0000_create_dish_category_group_votes.sql が該当する）。
        # コメントと文字列リテラルを落としてから見るために専用スクリプトへ切り出してある
        run: xargs -a /tmp/targets.txt node scripts/assert-migration-schema-scoped.mjs

      # ── 安全ゲート 3: 事後の検算に使う public のスナップショット ────────────
      - name: 接続先と public スキーマのスナップショットを取る
        shell: bash
        run: |
          set -euo pipefail
          psql "${DATABASE_URL}" -tAc "select 'user=' || current_user || ' db=' || current_database()"
          psql "${DATABASE_URL}" -tAc "
            select md5(string_agg(sig, '|' order by sig)) from (
              select c.relkind || ':' || c.relname || ':' || coalesce(count(a.attname)::text,'0') as sig
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              left join pg_attribute a on a.attrelid = c.oid and a.attnum > 0
              where n.nspname = 'public'
              group by c.relkind, c.relname
            ) t" > /tmp/public_before.txt
          echo "public スキーマのハッシュ(before): $(cat /tmp/public_before.txt)"

      - name: dry run（適用しない）
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "dry_run=true のため適用しませんでした。"
          echo "適用するには dry_run を false にして再実行してください。"

      - name: migration を適用
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # 既存の scripts/apply-migration.sh をそのまま使う（適用ロジックを二重に持たない）。
          # あのスクリプトは scripts/.env を source するので、ここで生成する。
          # ⚠️ DB_SCHEMA は上の env（dev 固定）から書き出す。input からは絶対に取らない
          printf 'DATABASE_URL=%s\nDB_SCHEMA=%s\n' "${DATABASE_URL}" "${DB_SCHEMA}" > scripts/.env
          trap 'rm -f scripts/.env' EXIT
          bash scripts/apply-migration.sh "${{ inputs.from_file }}"

      - name: public スキーマが 1 ビットも変わっていないことを検算
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          psql "${DATABASE_URL}" -tAc "
            select md5(string_agg(sig, '|' order by sig)) from (
              select c.relkind || ':' || c.relname || ':' || coalesce(count(a.attname)::text,'0') as sig
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              left join pg_attribute a on a.attrelid = c.oid and a.attnum > 0
              where n.nspname = 'public'
              group by c.relkind, c.relname
            ) t" > /tmp/public_after.txt
          echo "public スキーマのハッシュ(after) : $(cat /tmp/public_after.txt)"
          if ! diff -q /tmp/public_before.txt /tmp/public_after.txt >/dev/null; then
            echo "::error::本番スキーマ(public)が変化しました。適用した SQL を確認し、必要なら手で戻してください。"
            exit 1
          fi
          echo "✅ public は不変"

      # ── 適用後の schema.prisma / Prisma Client 再生成 ──────────────────────
      - name: 依存関係をインストール
        if: ${{ !inputs.dry_run && inputs.regenerate_prisma }}
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: schema.prisma と Prisma Client を再生成
        if: ${{ !inputs.dry_run && inputs.regenerate_prisma }}
        shell: bash
        # scripts/db-pull.sh を呼ばないのは、あれが api/.env の存在と Supabase CLI の
        # ログインを前提にしており（supabase gen types / converters 生成）、
        # CI では途中で必ず落ちるため。ここでは DATABASE_URL だけで完結する
        # 「introspect → generate」に絞る。Supabase 型と converters の再生成が要る
        # 変更のときは、ローカルで `pnpm db:pull` を実行すること
        run: |
          set -euo pipefail
          sed "s/__SCHEMA__/${DB_SCHEMA}/g" api/prisma/schema.template.prisma > api/prisma/schema.prisma
          pnpm -C api exec prisma db pull --schema prisma/schema.prisma --config ../prisma.config.ts
          pnpm -C api exec prisma generate --schema prisma/schema.prisma --config ../prisma.config.ts

      - name: 差分があればこのブランチへ commit する
        if: ${{ !inputs.dry_run && inputs.regenerate_prisma }}
        shell: bash
        run: |
          set -euo pipefail
          # scripts/.env が残っていたら絶対に commit しない（接続文字列が入っている）
          rm -f scripts/.env api/.env
          if git diff --quiet -- api/prisma/schema.prisma shared/prisma; then
            echo "schema.prisma / Prisma Client に差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/prisma/schema.prisma shared/prisma
          git commit -m "chore(db): dev スキーマの introspect 結果を反映する (${{ inputs.from_file }})"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: 適用後のテーブル一覧（先頭 40 件）
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          psql "${DATABASE_URL}" -c \
            "select table_name from information_schema.tables where table_schema='${DB_SCHEMA}' order by 1 limit 40"
