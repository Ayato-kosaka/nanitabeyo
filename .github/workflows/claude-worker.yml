name: Claude Worker

# ローカルのリーダーClaudeが、役割・モデル・プロンプトを都度決めて起動する汎用ワーカー。
# Issueの分割方法や設計・実装・レビューの進め方は、このWorkflowでは規定しない。
run-name: >-
  Claude Worker / ${{ inputs.task_key }} / ${{ inputs.model }} / ${{ inputs.access }}

on:
  workflow_dispatch:
    inputs:
      task_key:
        description: "実行を識別する一意なキー（英小文字・数字・._-）"
        required: true
        type: string
      prompt:
        description: "ローカルのリーダーClaudeが生成した完全な実行指示"
        required: true
        type: string
      model:
        description: "Claude Codeへ渡すモデルのエイリアスまたはモデルID"
        required: true
        default: "sonnet"
        type: string
      base_ref:
        description: "checkoutするブランチ、タグ、またはcommit SHA（空ならbase_branch）"
        required: false
        default: ""
        type: string
      base_branch:
        description: "PRのbaseにするブランチ（空なら既定ブランチ）"
        required: false
        default: ""
        type: string
      access:
        description: "observeはコードpush不可・Issue/PR記録可、writeは作業ブランチへの書込可"
        required: true
        default: "observe"
        type: choice
        options:
          - observe
          - write
      branch_name:
        description: "write時に使用するブランチ名。observeでは未使用"
        required: false
        default: ""
        type: string
      max_turns:
        description: "Claude Codeの最大ターン数（pnpm installやモノレポ全体のtypecheck/buildを伴う実装runは80〜150程度が目安）"
        required: true
        default: 40
        type: number
      extra_claude_args:
        description: "allowedToolsやeffort等、モデル・最大ターン数以外のClaude Code CLI引数"
        required: false
        default: ""
        type: string
      retention_days:
        description: "テストエビデンスArtifactの保存日数"
        required: true
        default: 14
        type: number

# 権限は各Jobで明示し、Workflow全体には暗黙の書込権限を与えない。
permissions: {}

jobs:
  validate:
    name: 入力検証
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 入力値を安全な範囲に制限
        shell: bash
        env:
          TASK_KEY: ${{ inputs.task_key }}
          ACCESS: ${{ inputs.access }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          BASE_BRANCH: ${{ inputs.base_branch || github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_TURNS: ${{ inputs.max_turns }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail

          if [[ ! "$TASK_KEY" =~ ^[a-z0-9][a-z0-9._-]{0,79}$ ]]; then
            echo "::error::task_key は英小文字・数字・._-の80文字以内で指定してください。"
            exit 1
          fi

          if (( MAX_TURNS < 1 || MAX_TURNS > 300 )); then
            echo "::error::max_turns は1〜300で指定してください。"
            exit 1
          fi

          if (( RETENTION_DAYS < 1 || RETENTION_DAYS > 90 )); then
            echo "::error::retention_days は1〜90で指定してください。"
            exit 1
          fi

          if ! git check-ref-format --branch "$BASE_BRANCH" >/dev/null; then
            echo "::error::base_branchがGitのブランチ名として不正です。"
            exit 1
          fi

          if [[ "$ACCESS" == "write" ]]; then
            if [[ -z "$BRANCH_NAME" ]]; then
              echo "::error::writeではbranch_nameが必須です。"
              exit 1
            fi

            if ! git check-ref-format --branch "$BRANCH_NAME" >/dev/null; then
              echo "::error::branch_nameがGitのブランチ名として不正です。"
              exit 1
            fi

            if [[ "$BRANCH_NAME" == "$DEFAULT_BRANCH" || "$BRANCH_NAME" == "$BASE_BRANCH" ]]; then
              echo "::error::writeのbranch_nameには既定ブランチまたはPRのbase branchを指定できません。"
              exit 1
            fi
          fi

  observe:
    name: 読み取りワーカー
    needs: validate
    if: inputs.access == 'observe'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      # 設計・調査・レビューではコードのpushを禁止する。
      contents: read
      # プロンプトで指示された場合だけ、Issue・PRへ結果を記録できる。
      issues: write
      pull-requests: write
      # CI結果を根拠としてレビューできるようにする。
      actions: read
      # Claude GitHub Appの短期トークン取得に使用する。
      id-token: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_ref || inputs.base_branch || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Artifact格納先を準備
        shell: bash
        # Git管理下へエビデンスを置くと、実装commitへの混入につながるため/tmpへ分離する。
        run: mkdir -p /tmp/claude-artifacts

      - name: Claude Codeを実行
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        env:
          # workflow_dispatchのrefではなく、実際に調査するrefをGitHub MCPへ渡す。
          CLAUDE_BRANCH: ${{ inputs.base_ref || inputs.base_branch || github.event.repository.default_branch }}
        with:
          # Maxプランで生成した長期OAuthトークンを使用し、APIキー課金を発生させない。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.prompt }}
          base_branch: ${{ inputs.base_branch || github.event.repository.default_branch }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            ${{ inputs.extra_claude_args }}
          # Claude GitHub Appトークンの既定値はcontents: writeのため、
          # observeでは明示的にreadへ下げ、コード変更を権限レベルで防ぐ。
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: write
            actions: read
          # 公開リポジトリのログへツール出力や機密情報を露出させない。
          show_full_output: false
          display_report: false

      - name: 実行結果を要約
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=/home/runner/work/_temp/claude-execution-output.json
          if [[ ! -f "$OUT" ]]; then
            echo "::warning::実行結果ログ($OUT)が見つかりません。"
            exit 0
          fi
          # ファイルはJSONL（改行区切りJSON）。-s で1つの配列にslurpしてから
          # type=result の最後の要素（実行全体のサマリ）を取り出す。
          SUBTYPE=$(jq -rs '[.[] | select(.type=="result")] | last | .subtype // "unknown"' "$OUT" 2>/dev/null || echo unknown)
          IS_ERROR=$(jq -rs '[.[] | select(.type=="result")] | last | .is_error // false' "$OUT" 2>/dev/null || echo unknown)
          NUM_TURNS=$(jq -rs '[.[] | select(.type=="result")] | last | .num_turns // "?"' "$OUT" 2>/dev/null || echo "?")
          COST=$(jq -rs '[.[] | select(.type=="result")] | last | .total_cost_usd // "?"' "$OUT" 2>/dev/null || echo "?")
          DENIALS=$(jq -rs '[.[] | select(.type=="result")] | last | .permission_denials_count // 0' "$OUT" 2>/dev/null || echo 0)
          {
            echo "### Claude Code 実行結果"
            echo "- subtype: \`$SUBTYPE\` / is_error: \`$IS_ERROR\`"
            echo "- turns: $NUM_TURNS / cost: \$$COST / permission denials: $DENIALS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DENIALS" != "0" && "$DENIALS" != "null" ]]; then
            echo "::warning::permission_denials_count=$DENIALS。allowedToolsのBashパターンが実際のコマンドと一致していない可能性があります（複合コマンドはprefixパターンに丸ごと弾かれます）。"
          fi
          if [[ "$SUBTYPE" == "error_max_turns" ]]; then
            echo "::warning::max_turns($NUM_TURNS)に到達して打ち切られました。タスクを分割するか max_turns を増やして再実行してください。"
          fi

      - name: テストエビデンスを保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-${{ inputs.task_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/claude-artifacts/
          if-no-files-found: ignore
          # dotfileへ紛れた認証情報等を意図せず公開Artifactへ含めない。
          include-hidden-files: false
          retention-days: ${{ inputs.retention_days }}

  write:
    name: 書き込みワーカー
    needs: validate
    if: inputs.access == 'write'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # 異なるbranchは並列のまま、同じbranchへのpushだけを直列化する。
    concurrency:
      group: claude-worker-${{ github.repository }}-${{ inputs.branch_name }}
      cancel-in-progress: false
    permissions:
      # 対象branchはCLAUDE_BRANCHとpromptで固定し、既定branchはrulesetでも保護する。
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_ref || inputs.base_branch || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: 指定された作業ブランチへ切り替え
        shell: bash
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail

          # 既存ブランチならレビュー指摘への追従として継続し、なければ現在のbase_refから作る。
          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
            git switch "$BRANCH_NAME"
          elif git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
            git switch --create "$BRANCH_NAME" --track "origin/$BRANCH_NAME"
          else
            git switch --create "$BRANCH_NAME"
          fi

      - name: 実行前のHEADを記録
        id: pre_claude
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Artifact格納先を準備
        shell: bash
        # 実装ファイルとテストエビデンスを分離し、誤commitを防ぐ。
        run: mkdir -p /tmp/claude-artifacts

      - name: Claude Codeを実行
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        env:
          # Action内部のGitHub MCPも、事前に切り替えた同じ作業ブランチだけを更新させる。
          CLAUDE_BRANCH: ${{ inputs.branch_name }}
        with:
          # Maxプランで生成した長期OAuthトークンを使用し、APIキー課金を発生させない。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.prompt }}
          base_branch: ${{ inputs.base_branch || github.event.repository.default_branch }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            ${{ inputs.extra_claude_args }}
          # 使用権限をWorkflow上にも列挙し、動的promptから権限を拡張させない。
          additional_permissions: |
            contents: write
            pull_requests: write
            issues: write
            actions: read
          show_full_output: false
          display_report: false

      - name: 実行結果を要約
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=/home/runner/work/_temp/claude-execution-output.json
          if [[ ! -f "$OUT" ]]; then
            echo "::warning::実行結果ログ($OUT)が見つかりません。"
            exit 0
          fi
          SUBTYPE=$(jq -rs '[.[] | select(.type=="result")] | last | .subtype // "unknown"' "$OUT" 2>/dev/null || echo unknown)
          IS_ERROR=$(jq -rs '[.[] | select(.type=="result")] | last | .is_error // false' "$OUT" 2>/dev/null || echo unknown)
          NUM_TURNS=$(jq -rs '[.[] | select(.type=="result")] | last | .num_turns // "?"' "$OUT" 2>/dev/null || echo "?")
          COST=$(jq -rs '[.[] | select(.type=="result")] | last | .total_cost_usd // "?"' "$OUT" 2>/dev/null || echo "?")
          DENIALS=$(jq -rs '[.[] | select(.type=="result")] | last | .permission_denials_count // 0' "$OUT" 2>/dev/null || echo 0)
          {
            echo "### Claude Code 実行結果"
            echo "- subtype: \`$SUBTYPE\` / is_error: \`$IS_ERROR\`"
            echo "- turns: $NUM_TURNS / cost: \$$COST / permission denials: $DENIALS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DENIALS" != "0" && "$DENIALS" != "null" ]]; then
            echo "::warning::permission_denials_count=$DENIALS。allowedToolsのBashパターンが実際のコマンドと一致していない可能性があります（複合コマンドはprefixパターンに丸ごと弾かれます）。"
          fi
          if [[ "$SUBTYPE" == "error_max_turns" ]]; then
            echo "::warning::max_turns($NUM_TURNS)に到達して打ち切られました。タスクを分割するか max_turns を増やして再実行してください。"
          fi

      - name: commit・pushされたことを検証
        # このstepは常に実行し、Claude Codeが権限拒否やturn切れで行き詰まり
        # 何もcommit・pushしないまま終了した場合でもjobを明示的に失敗させる。
        # (SDKの実行自体は is_error:false で「成功」報告されることがあるため、
        # workflow runのconclusionだけでは成果物の有無を判断できない)
        if: always()
        shell: bash
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          PRE_SHA: ${{ steps.pre_claude.outputs.sha }}
        run: |
          set -euo pipefail
          POST_SHA=$(git rev-parse HEAD)
          if [[ "$PRE_SHA" == "$POST_SHA" ]]; then
            echo "::error::作業ブランチ '$BRANCH_NAME' に新しいcommitがありません（実行前後でHEADが変化していません）。Claude Codeが権限不足・turn切れ・その他の理由で変更を確定できなかった可能性があります。"
            exit 1
          fi
          echo "✓ HEADが変化: $PRE_SHA -> $POST_SHA"

          git fetch origin "refs/heads/$BRANCH_NAME" 2>/dev/null || true
          REMOTE_SHA=$(git rev-parse "origin/$BRANCH_NAME" 2>/dev/null || echo "")
          if [[ -z "$REMOTE_SHA" ]]; then
            echo "::error::作業ブランチ '$BRANCH_NAME' がoriginへpushされていません。commitはローカルに存在しますが共有されていません。"
            exit 1
          fi
          if [[ "$REMOTE_SHA" != "$POST_SHA" ]]; then
            echo "::warning::originの '$BRANCH_NAME' ($REMOTE_SHA) が最新のローカルcommit ($POST_SHA) と一致しません。最後の変更がpushされていない可能性があります。"
          else
            echo "✓ originへpush済み: $REMOTE_SHA"
          fi

      - name: テストエビデンスを保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-${{ inputs.task_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/claude-artifacts/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: ${{ inputs.retention_days }}
