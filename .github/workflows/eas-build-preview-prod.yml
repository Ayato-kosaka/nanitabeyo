name: EAS Build Preview

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android

jobs:
  build-preview:
    name: EAS Build (Preview)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app-expo

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4

      # #1030 【セキュリティ】E2E セッション注入フック用フラグが本番系ジョブへ紛れ込んでいないことを検証する。
      # 主ガードは metro.config.js の EAS 経路 hard fail だが、ローカルバンドル経路の早期検知として残す
      - name: 🔒 Assert E2E auth hook flag is empty
        run: |
          if [ -n "${EXPO_PUBLIC_E2E_AUTH_HOOK:-}" ]; then
            echo "::error::EXPO_PUBLIC_E2E_AUTH_HOOK が設定されています。本番系ワークフローでの設定は禁止です（#1030）。"
            exit 1
          fi

      - name: 🟣 Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.8.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ✨ Update environment variable
        run: pnpx eas-cli env:update --variable-name EXPO_PUBLIC_COMMIT_ID --value ${{ github.sha }}  --non-interactive

      - name: 🚀 Build app (preview)
        run: pnpx eas-cli build --profile preview --platform ${{ inputs.platform || 'all' }} --non-interactive --no-wait --clear-cache
