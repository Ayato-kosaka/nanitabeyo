name: Manual Feature Correction

# ==============================================================================
# #1383: 実運用でおかしいと分かった dish_category の feature score
# （例: dining_pace:quick で焼き鳥が過大評価されていた）を、人間のレビューに基づいて
# 安全に補正するための workflow。
#
# scripts/20251213T0000_wikidata_food_graph/581_relevance_scoring/manual/ の
# 1_insert_feature_scores.py / 2_merge_feature_scores.py と、既存の
# 9_2_sync_dish_category_features.py をラップする。
#
# ## なぜ Actions でやるのか
# db-migrate.yml と同じ理由。DATABASE_URL や GCP サービスアカウント資格情報を
# ローカル/対話セッションに置かず、「いつ・誰が・どの run_id を適用したか」を
# dispatch のログとして残す。
#
# ## このworkflowが扱わないもの
# - PostgreSQL `public`（本番）への反映（sync-dev は dev 固定）。本番反映は
#   db-migrate.yml に準じた承認フローを別途用意してから行う。
# - dish_category_features_catalog 自体は dev/public で分かれていない共有の採用版のため、
#   insert / merge の対象は常に「採用版そのもの」であることに注意する。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      step:
        description: "実行するstep"
        required: true
        type: choice
        default: insert
        options:
          - insert
          - merge
          - sync-dev
      run_id:
        description: "対象run_id（insert / merge で必須）"
        required: false
        type: string
      corrections_jsonl:
        description: "insertで投入するJSONL本文（1行1件）。manual/README.mdのフォーマットを参照"
        required: false
        type: string
      allow_new_feature_key:
        description: "insert: 既存catalogに無い(feature_type, feature_key)を許可する"
        required: false
        default: false
        type: boolean
      expected_row_count:
        description: "merge: 事故防止の件数チェック（任意）"
        required: false
        type: string
      expected_item_count:
        description: "merge: 事故防止の件数チェック（任意）"
        required: false
        type: string
      dry_run:
        description: "true なら実書き込みをしない"
        required: false
        default: true
        type: boolean

concurrency:
  group: manual-feature-correction
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: "${{ inputs.step }} (dry_run=${{ inputs.dry_run }})"
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
      GCP_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 入力チェック
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.step }}" != "sync-dev" ] && [ -z "${{ inputs.run_id }}" ]; then
            echo "::error::step=${{ inputs.step }} には run_id が必須です。"
            exit 1
          fi
          if [ "${{ inputs.step }}" == "insert" ] && [ -z "${{ inputs.corrections_jsonl }}" ]; then
            echo "::error::step=insert には corrections_jsonl が必須です。"
            exit 1
          fi

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係をインストール
        shell: bash
        run: pip install -r scripts/20251213T0000_wikidata_food_graph/requirements.txt

      - name: Google Cloud サービスアカウントで認証
        shell: bash
        run: |
          echo "$GCP_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: secret の有無を確認（sync-dev のみ DATABASE_URL が必須）
        if: ${{ inputs.step == 'sync-dev' }}
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::secrets.POSTGRES_DATABASE_URL が未設定です。"
            exit 1
          fi

      - name: corrections_jsonl を一時ファイルへ書き出す
        if: ${{ inputs.step == 'insert' }}
        shell: bash
        run: |
          cat > /tmp/corrections.jsonl <<'CORRECTIONS_EOF'
          ${{ inputs.corrections_jsonl }}
          CORRECTIONS_EOF

      - name: "insert: manual/1_insert_feature_scores.py"
        if: ${{ inputs.step == 'insert' }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--run-id "${{ inputs.run_id }}" --input-jsonl /tmp/corrections.jsonl)
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ inputs.allow_new_feature_key }}" == "true" ]; then
            ARGS+=(--allow-new-feature-key)
          fi
          python3 scripts/20251213T0000_wikidata_food_graph/581_relevance_scoring/manual/1_insert_feature_scores.py "${ARGS[@]}" \
            | tee /tmp/step-output.txt

      - name: "merge: manual/2_merge_feature_scores.py"
        if: ${{ inputs.step == 'merge' }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--run-id "${{ inputs.run_id }}")
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--apply)
          fi
          if [ -n "${{ inputs.expected_row_count }}" ]; then
            ARGS+=(--expected-row-count "${{ inputs.expected_row_count }}")
          fi
          if [ -n "${{ inputs.expected_item_count }}" ]; then
            ARGS+=(--expected-item-count "${{ inputs.expected_item_count }}")
          fi
          python3 scripts/20251213T0000_wikidata_food_graph/581_relevance_scoring/manual/2_merge_feature_scores.py "${ARGS[@]}" \
            | tee /tmp/step-output.txt

      - name: "sync-dev: 9_2_sync_dish_category_features.py --schema dev"
        if: ${{ inputs.step == 'sync-dev' }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--schema dev)
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 scripts/20251213T0000_wikidata_food_graph/9_2_sync_dish_category_features.py "${ARGS[@]}" \
            | tee /tmp/step-output.txt

      - name: Job Summary へ出力
        if: always()
        shell: bash
        run: |
          {
            echo "## Manual Feature Correction: ${{ inputs.step }}"
            echo ""
            echo "- run_id: \`${{ inputs.run_id }}\`"
            echo "- dry_run: \`${{ inputs.dry_run }}\`"
            echo ""
            echo '```'
            cat /tmp/step-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
