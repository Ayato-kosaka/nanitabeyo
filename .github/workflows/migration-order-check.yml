name: Migration Order Check

# ==============================================================================
# migration の「ファイル名順 = 適用順」を PR で守るゲート
#
# このリポジトリの migration は DB 側に台帳を持たず、apply-migration.sh が
# from_file 以降をファイル名昇順で流す。よって、既存ファイルより辞書順で前に
# 新ファイルが割り込むと適用順が壊れる（実際に 2026-08 に発生した。
# 20260819T* が dev 先行適用のまま、main へ 20260823T0000 が先に入った）。
#
# ここでは PR が追加する *.sql が base の最後尾より後ろであることだけを検査する。
# 依存ゼロの bash なので fork からの PR でも動く。
# 運用の全体像: infra/supabase/migrations/README.md
#
# ⚠️ **比べる相手は base ブランチの «いまの先頭» である**（2026-09-24）。
#    もともと `github.event.pull_request.base.sha`（= PR イベント時点の main の
#    スナップショット）と比べていたため、**PR が開いている間に main が migration を
#    得ても再検査されず、緑のまま古くなった**。
#
#    実際に #2012（`20260923T0000_create_restaurant_reports.sql`）で起きた。
#    出した 9/23 時点の main の最後尾は `20260906T0000_...` で緑だったが、
#    その後 #2043 が `20260924T0000` / `20260924T0100` を main へ入れたので、
#    **あのファイルは適用列の途中へ割り込む名前になっていた**。緑のままだった。
#
#    答えるべき問いは «ブランチを切った時点で順序が正しかったか» ではなく
#    **«いま main へマージしたら順序が壊れるか»** である。
# ==============================================================================

on:
  pull_request:
    paths:
      - "infra/supabase/migrations/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  order-check:
    name: migration ファイル名の順序を検査
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: base ブランチのいまの先頭を取得して順序を検査
        env:
          # ⚠️ `base.sha`（イベント時点のスナップショット）ではなく **ブランチ名**を使う。
          #    理由は冒頭の注記。
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          bash scripts/assert-migration-filename-order.sh FETCH_HEAD
