name: EAS Update (Production or Preview)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Select EAS Update Channel"
        required: true
        default: "preview"
        type: choice
        options:
          - production
          - preview

jobs:
  eas-update:
    name: EAS Update (${{ github.event.inputs.channel }})
    runs-on: ubuntu-latest

    env:
      CI: true

    defaults:
      run:
        working-directory: app-expo

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # #1027 / #1030 / #1031 【セキュリティ】E2E フック用フラグ
      # （セッション注入・メディア選択差し替え・チュートリアルシード）が
      # 本番系ジョブへ紛れ込んでいないことを検証する。
      # 主ガードは metro.config.js の EAS 経路 hard fail だが、ローカルバンドル経路の早期検知として残す
      - name: 🔒 Assert E2E hook flags are empty
        run: |
          if [ -n "${EXPO_PUBLIC_E2E_AUTH_HOOK:-}" ]; then
            echo "::error::EXPO_PUBLIC_E2E_AUTH_HOOK が設定されています。本番系ワークフローでの設定は禁止です（#1030）。"
            exit 1
          fi
          if [ -n "${EXPO_PUBLIC_E2E_MEDIA_HOOK:-}" ]; then
            echo "::error::EXPO_PUBLIC_E2E_MEDIA_HOOK が設定されています。本番系ワークフローでの設定は禁止です（#1031）。"
            exit 1
          fi
          if [ -n "${EXPO_PUBLIC_E2E_TUTORIAL_HOOK:-}" ]; then
            echo "::error::EXPO_PUBLIC_E2E_TUTORIAL_HOOK が設定されています。本番系ワークフローでの設定は禁止です（#1027）。"
            exit 1
          fi

      - name: 🟣 Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.8.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          # #1375 20 のままだと EAS CLI のインストールが必ず失敗する。
          #   error @oclif/plugin-autocomplete@3.3.0: The engine "node" is incompatible
          #   with this module. Expected version ">=22.0.0". Got "20.20.2"
          # `eas-version: latest` で最新を取りに行くので、CLI 側が Node 22 を要求し始めた時点で
          # このジョブは «配信できない» 状態になる（2026-08-25 の OTA 配信が実際にこれで落ちた）。
          # ランナー自体も Node 20 の非推奨警告を出しているので 22 へ上げる。
          node-version: "22"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ✨ Update environment variable
        run: |
          pnpx eas-cli env:update ${{ github.event.inputs.channel }} \
            --variable-name EXPO_PUBLIC_COMMIT_ID \
            --value ${{ github.sha }} \
            --non-interactive

      - name: 📤 EAS Update to selected channel
        run: |
          echo "Starting EAS update to channel: ${{ github.event.inputs.channel }}"
          pnpx eas-cli update \
            --channel ${{ github.event.inputs.channel }} \
            --platform all \
            --message "Update from GitHub Actions: ${{ github.sha }}" \
            --environment ${{ github.event.inputs.channel }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
