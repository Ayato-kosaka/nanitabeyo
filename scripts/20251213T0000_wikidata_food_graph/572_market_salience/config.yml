# #572 market_salience LLMラベリング設定ファイル

# BigQuery設定
dataset: "food-scroll.wikidata_food_graph"

# Market設定
market_key: "region:country:JP"

# タスク識別子
task_pass1: "#572_market_salience_p1"
task_pass2: "#572_market_salience_p2"

# 実行ID（タイムスタンプベース、実行時に上書き可能）
run_id_prefix: "20251221T0000"

# モデル設定
model_pass1: "gpt-4.1-mini" # gpt-5-mini も選択可能
model_pass2: "gpt-5.2"

# Batch API設定
batch_api: true
batch_poll_interval_sec: 30

# テスト用データ制限（null = 全件処理）
max_items: null # テスト時は 100 等を指定

# ファイルパス設定
input_export_path: "/tmp/wikidata_food_market_salience"
payload_dir: "/tmp/wikidata_food_market_salience/payload"
results_dir: "/tmp/wikidata_food_market_salience/results"

# Pass2発火条件
pass2_trigger_confidence: ["medium", "low"]

# LLM出力制限
reason_max_chars: 120
regional_reason_max_chars: 120

# 入力カード設定
include_optional_fields: true # has_jawiki, tags_top を含めるか

# 期待値計算設定
expected_value_runs: 1 # 将来複数run平均に対応する場合に備えた設定

# バッチサイズ
batch_size: 10 # 1リクエストあたりのアイテム数
