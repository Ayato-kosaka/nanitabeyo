# #575 dine_out_orderability LLMラベリング設定ファイル

# BigQuery設定
dataset: "food-scroll.wikidata_food_graph"

# タスク識別子
task: "#575_dine_out_orderability"

# 実行ID（タイムスタンプベース、実行時に上書き可能）
run_id_prefix: "20251221T0000"

# モデル設定
model: "gpt-4.1-mini"  # gpt-5-mini も選択可能

# Batch API設定
batch_api: true
batch_poll_interval_sec: 30

# テスト用データ制限（null = 全件処理）
max_items: null  # テスト時は 100 等を指定

# ファイルパス設定
input_export_path: "/tmp/wikidata_food_dine_out_orderability"
payload_dir: "/tmp/wikidata_food_dine_out_orderability/payload"
results_dir: "/tmp/wikidata_food_dine_out_orderability/results"

# LLM出力制限
reason_max_chars: 120

# 入力カード設定
include_optional_fields: false  # has_jawiki, tags_top を含めるか

# バッチサイズ
batch_size: 10  # 1リクエストあたりのアイテム数
