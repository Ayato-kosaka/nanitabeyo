# #581 dish_category relevance_scoring LLM設定ファイル

# BigQuery設定
dataset: "food-scroll.wikidata_food_graph"

# タスク識別子
task: "#581_relevance_scoring"

# 実行ID接頭辞（タイムスタンプベース、実行時に上書き可能）
run_id_prefix: "20251223T0000"

# 前回実行ID（差分実行時に指定、null = 全件対象）
prev_run_id: null

# 最終公開用ID
final_run_id: "20251223T0000_final"

# モデル設定
model: "gpt-4.1-mini"  # gpt-5-mini も選択可能

# Batch API設定
batch_api: true
batch_poll_interval_sec: 30

# テスト用データ制限（null = 全件処理）
max_items: null  # テスト時は 100 等を指定

# ファイルパス設定
input_export_path: "/tmp/wikidata_food_relevance_scoring"
payload_dir: "/tmp/wikidata_food_relevance_scoring/payload"
results_dir: "/tmp/wikidata_food_relevance_scoring/results"

# LLM出力制限
reason_max_chars: 120

# バッチサイズ（1リクエストあたりのアイテム数）
batch_size: 10

# Feature定義
features:
  timeSlot:
    keys:
      - morning
      - lunch
      - afternoon
      - dinner
      - late_night
  scene:
    keys:
      - solo
      - date
      - friends
      - family
      - drinking
  satiety:
    keys:
      - hearty
      - normal
      - light
  taste:
    keys:
      - sweet
      - spicy
      - healthy
      - junk
      - alcohol
